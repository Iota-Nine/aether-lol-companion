name: Release Windows

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install
        run: npm ci

      - name: Build UI + server
        run: npm run build

      - name: Publish Windows Setup (NSIS)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx electron-builder --win nsis --publish always

      - name: Build Portable (no publish race)
        run: npx electron-builder --win portable --publish never

      - name: Upload Portable to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          $ver = (Get-Content package.json | ConvertFrom-Json).version
          $portable = Get-ChildItem "release/AETHER-Portable-$ver.exe" -ErrorAction SilentlyContinue
          if (-not $portable) { $portable = Get-ChildItem release/AETHER-Portable-*.exe | Select-Object -First 1 }
          if ($portable) {
            gh release upload "v$ver" $portable.FullName --clobber
          } else {
            Write-Host "Portable introuvable — skip"
          }
