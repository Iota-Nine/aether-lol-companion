name: Release Windows

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install
        run: npm ci

      - name: Build UI + server
        run: npm run build

      - name: Build Windows installers
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EP_DRAFT: 'false'
        run: npx electron-builder --win nsis portable --publish never

      - name: Ensure GitHub release + upload assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          $ver = (Get-Content package.json | ConvertFrom-Json).version
          $tag = "v$ver"
          $setup = "release/AETHER-Setup-$ver.exe"
          $blockmap = "release/AETHER-Setup-$ver.exe.blockmap"
          $portable = "release/AETHER-Portable-$ver.exe"
          $yml = "release/latest.yml"

          if (-not (Test-Path $setup)) { throw "Missing $setup" }

          # latest.yml requis pour electron-updater (généré si absent)
          if (-not (Test-Path $yml)) {
            $bytes = [IO.File]::ReadAllBytes((Resolve-Path $setup))
            $sha = [Convert]::ToBase64String([Security.Cryptography.SHA512]::Create().ComputeHash($bytes))
            $size = (Get-Item $setup).Length
            $date = (Get-Date).ToUniversalTime().ToString("yyyy-MM-ddTHH:mm:ss.fffZ")
            @"
          version: $ver
          files:
            - url: AETHER-Setup-$ver.exe
              sha512: $sha
              size: $size
          path: AETHER-Setup-$ver.exe
          sha512: $sha
          releaseDate: '$date'
          "@ | Set-Content -Path $yml -Encoding utf8
          }

          gh release view $tag 2>$null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag --title $ver --notes "AETHER $ver" --latest
          } else {
            gh release edit $tag --draft=false --latest
          }

          $uploads = @($setup, $yml)
          if (Test-Path $blockmap) { $uploads += $blockmap }
          if (Test-Path $portable) { $uploads += $portable }

          gh release upload $tag @uploads --clobber

          $names = @(gh api "repos/Iota-Nine/aether-lol-companion/releases/tags/$tag" --jq ".assets[].name")
          Write-Host "Assets:`n$($names -join "`n")"
          if ($names -notcontains "AETHER-Setup-$ver.exe") { throw "Setup missing on release" }
          if ($names -notcontains "latest.yml") { throw "latest.yml missing on release" }
